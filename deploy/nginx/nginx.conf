worker_processes 1;
error_log deploy/nginx/error.log;
pid deploy/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    types {
        text/html html htm;
        text/css css;
        application/javascript js;
        application/json json;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/svg+xml svg;
        image/x-icon ico;
        font/woff woff;
        font/woff2 woff2;
        font/ttf ttf;
    }
    default_type application/octet-stream;
    charset utf-8;
    access_log deploy/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 6m;
    client_body_temp_path deploy/nginx/client_temp;
    proxy_temp_path deploy/nginx/proxy_temp;
    fastcgi_temp_path deploy/nginx/fastcgi_temp;
    uwsgi_temp_path deploy/nginx/uwsgi_temp;
    scgi_temp_path deploy/nginx/scgi_temp;

    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        root frontend;
        index index.html;

        location /api/ {
            proxy_pass http://127.0.0.1:8081/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /imgs/ {
            try_files $uri @uploaded_image;
        }

        location @uploaded_image {
            rewrite ^/imgs/(.*)$ /$1 break;
            root uploads;
        }
    }
}
