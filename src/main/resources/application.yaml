server:
  address: ${SMARTLIFE_SERVER_ADDRESS:127.0.0.1}
  port: ${SMARTLIFE_SERVER_PORT:8081}
spring:
  application:
    name: smart-life
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${SMARTLIFE_DB_HOST:127.0.0.1}:${SMARTLIFE_DB_PORT:3306}/${SMARTLIFE_DB_NAME:smartlife}?sslMode=${SMARTLIFE_DB_SSL_MODE:PREFERRED}&serverTimezone=UTC&characterEncoding=utf8
    username: ${SMARTLIFE_DB_USER:root}
    password: ${SMARTLIFE_DB_PASSWORD:}
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
  data:
    redis:
      host: ${SMARTLIFE_REDIS_HOST:127.0.0.1}
      port: ${SMARTLIFE_REDIS_PORT:6379}
      password: ${SMARTLIFE_REDIS_PASSWORD:}
      database: ${SMARTLIFE_REDIS_DATABASE:0}
      ssl:
        enabled: ${SMARTLIFE_REDIS_SSL:false}
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null
mybatis-plus:
  type-aliases-package: com.bee.smartlife.entity
logging:
  level:
    com.bee.smartlife: ${SMARTLIFE_LOG_LEVEL:debug}
rocketmq:
  name-server: ${SMARTLIFE_MQ_NAME_SERVER:127.0.0.1:9876}
  seckill-topic: ${SMARTLIFE_MQ_TOPIC:smartlife-seckill-order}
  consumer-group: ${SMARTLIFE_MQ_CONSUMER_GROUP:voucher-order-consumer-group}
smartlife:
  upload-dir: ${SMARTLIFE_UPLOAD_DIR:./uploads}
  orders:
    consumer-enabled: ${SMARTLIFE_ORDER_CONSUMER_ENABLED:true}
    recovery-enabled: ${SMARTLIFE_ORDER_RECOVERY_ENABLED:true}
    recovery-delay-ms: 60000
    recovery-age-seconds: 120
    recovery-batch: 100
